<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>404 - Page Not Found | EverGrace Senior Care</title>
  <meta name="description" content="We're sorry, the page you requested could not be found. Return to home or go back.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8fafc; padding: 24px 16px;">

  <!-- PRELOADER (1.5s Animation) -->
  <div id="preloader" class="preloader" aria-label="Loading EverGrace Senior Care">
    <div class="preloader-content">
      <div class="preloader-heart">
        <div class="heart-pulse"><i class="fa-solid fa-heart"></i></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring ring-2"></div>
      </div>
      <div class="preloader-brand">
        <img src="assets/images/logo_0945.webp" alt="Logo" style="height: 36px; width: auto; object-fit: contain; margin: 0 auto 6px; display: block;">
        <span>Senior Living & Care</span>
      </div>
      <div class="preloader-bar">
        <div class="preloader-progress"></div>
      </div>
      <div class="preloader-status">Navigating to Page...</div>
    </div>
  </div>

  <!-- 404 MAIN CONTENT (NO HEADER & NO FOOTER, EXACTLY TWO BUTTONS: HOME & BACK) -->
  <main style="width: 100%; max-width: 560px; margin: auto; text-align: center;">
    <div class="card" style="padding: clamp(28px, 6vw, 48px); border-radius: 24px; box-shadow: var(--shadow-xl); background: #ffffff; border: 1px solid var(--border-color);">
      
      <!-- Brand Logo -->
      <div style="margin-bottom: 24px;">
        <a href="index.html" aria-label="Home" style="display: inline-block;">
          <img src="assets/images/logo_0945.webp" alt="Logo" class="brand-logo-img" style="height: 52px; width: auto; max-width: 220px; margin: 0 auto; display: block;">
        </a>
      </div>

      <!-- 404 Visual / Illustration -->
      <div style="position: relative; width: min(100%, 320px); margin: 0 auto 22px; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-md);">
        <img src="assets/images/hero-trust.webp" alt="Compassionate Care" width="320" height="200" style="width: 100%; height: 100%; object-fit: cover;">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13, 114, 101, 0.25) 0%, rgba(15, 23, 42, 0.78) 100%); display: flex; align-items: flex-end; justify-content: center; padding: 14px;">
          <span style="font-size: clamp(3.2rem, 10vw, 4.5rem); font-weight: 800; color: #ffffff; line-height: 1; text-shadow: 0 4px 14px rgba(0,0,0,0.5);">404</span>
        </div>
      </div>

      <div class="badge-pill badge-accent" style="margin-bottom: 12px;"><i class="fa-solid fa-compass"></i> Page Not Found</div>
      <h1 style="font-size: clamp(1.4rem, 4vw, 1.85rem); color: var(--secondary); margin-bottom: 10px; font-weight: 800;">
        Oops! Page Not Found
      </h1>
      <p style="font-size: 0.92rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.6;">
        The page you are looking for might have been moved, renamed, or is temporarily unavailable. Use the buttons below to return home or navigate back.
      </p>

      <!-- ONLY TWO BUTTONS: HOME AND BACK -->
      <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-lg" style="flex: 1; min-width: 150px; text-align: center; justify-content: center;">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <button type="button" onclick="if(window.history.length > 1){window.history.back();}else{window.location.href='index.html';}" class="btn btn-outline btn-lg" style="flex: 1; min-width: 150px; text-align: center; justify-content: center;">
          <i class="fa-solid fa-arrow-left"></i> Back
        </button>
      </div>

    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
